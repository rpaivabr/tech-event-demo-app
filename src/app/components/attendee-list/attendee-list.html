<div class="container">
  <mat-list role="list">
    @for (attendee of attendees(); track $index) {
      <app-attendee-item [attendee]="attendee" (deleteItem)="deleteItem($index)" />
    } @empty {
      <p>Nenhum participante encontrado. Crie um novo agora.</p>
    }
  </mat-list>
  <button matButton="filled" routerLink="/new">Adicionar Participante</button>
</div>
