<div class="container flex">
  <h3>Total de participantes: {{totalAttendees()}}</h3>
  <button matButton="filled" routerLink="/new">Adicionar Participante</button>
</div>
@if (!isLoading()) {
  <app-attendee-list 
    [attendees]="attendees()" 
    (addNew)="addAttendee($event)" 
    (deleteItem)="deleteAttendee($event)"
  />
} @else {
  <p>Carregando...</p>
}
